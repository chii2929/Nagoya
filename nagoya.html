<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MedEats 調劑台補給站</title>
<style>
  :root {
    --bg-main: #F6F6F6;
    --bg-card: #FFFFFF;
    --text-primary: #000000;
    --text-secondary: #545454;
    --ue-green: #06C167;
    --ue-green-dark: #05A357;
    --ue-green-light: #E6F9F0;
    --ue-black: #141414;
    --border: #EEEEEE;
    --warning: #E56B1F;
    --warning-light: #FFF3EB;
    --danger: #D93025;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    padding-bottom: 115px;
    -webkit-tap-highlight-color: transparent;
  }

  /* Uber Eats 風格頂部導覽列 */
  header {
    background-color: var(--bg-card);
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 120;
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ue-black);
  }

  .brand-logo span {
    color: var(--ue-green);
  }

  .delivery-pill {
    background-color: var(--bg-main);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-pill-gray {
    background: var(--bg-main);
    border: none;
    color: var(--text-primary);
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.15s;
  }

  .btn-pill-gray:active {
    background: #E2E2E2;
  }

  .btn-pill-black {
    background: var(--ue-black);
    border: none;
    color: #FFFFFF;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.15s;
  }

  .btn-pill-black:active {
    opacity: 0.8;
  }

  /* 膠囊型搜尋框 */
  .search-bar {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-input-wrap {
    position: relative;
    flex: 1;
  }

  .search-bar input {
    width: 100%;
    padding: 11px 34px 11px 40px;
    border-radius: 24px;
    border: none;
    background-color: var(--bg-main);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    outline: none;
    transition: box-shadow 0.2s;
  }

  .search-bar input:focus {
    box-shadow: inset 0 0 0 2px var(--ue-black);
    background-color: #FFF;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-primary);
    font-size: 15px;
  }

  .search-clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: #DCDCDC;
    border: none;
    color: var(--text-primary);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 800;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .search-nav-controls {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .search-match-count {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .btn-search-next {
    background-color: var(--ue-black);
    color: #FFF;
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-search-next:active {
    opacity: 0.8;
  }

  /* 螢光筆高亮與目前跳轉焦點 */
  mark.search-hl {
    background-color: #FFE566;
    color: #000000;
    padding: 0 2px;
    border-radius: 4px;
    font-weight: 800;
  }

  .med-card.search-focus {
    box-shadow: 0 0 0 2.5px #FFB300, 0 4px 14px rgba(255, 179, 0, 0.25);
    background-color: #FFFDF2;
  }

  /* 店家評分提示列 (會隨頁面向上滑出消失，不佔用吸頂空間) */
  .store-meta-bar {
    background: var(--bg-card);
    padding: 10px 18px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 吸頂分區導覽 Tab */
  .sticky-zone-bar {
    background: var(--bg-card);
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 102px;
    z-index: 110;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
  }

  .store-rating {
    font-weight: 700;
    color: var(--text-primary);
  }

  .zone-tabs {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .zone-tabs::-webkit-scrollbar { display: none; }

  .zone-tab {
    padding: 10px 4px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }

  .zone-tab.active {
    color: var(--ue-black);
    border-bottom-color: var(--ue-black);
  }

  /* 藥品列表容器與手風琴展開面板 */
  .container {
    padding: 12px 16px;
    max-width: 800px;
    margin: 0 auto;
  }

  .accordion-group {
    background-color: var(--bg-card);
    border-radius: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .accordion-header {
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background-color: var(--bg-card);
    border-radius: 16px;
    user-select: none;
    transition: background-color 0.15s;
  }

  .accordion-group.open .accordion-header {
    position: sticky;
    top: 144px;
    z-index: 90;
    border-radius: 16px 16px 0 0;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
  }

  .accordion-header:active {
    background-color: #FAFAFA;
  }

  .accordion-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slot-badge-lg {
    background-color: var(--ue-black);
    color: #FFF;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    letter-spacing: 0.3px;
  }

  .slot-count-text {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .slot-selected-pill {
    background-color: var(--ue-green-light);
    color: var(--ue-green-dark);
    font-size: 12px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 12px;
  }

  .accordion-arrow {
    font-size: 14px;
    color: var(--text-secondary);
    transition: transform 0.25s ease;
  }

  .accordion-group.open .accordion-arrow {
    transform: rotate(180deg);
  }

  .accordion-body {
    display: none;
    padding: 6px 16px 12px;
    border-radius: 0 0 16px 16px;
  }

  .accordion-group.open .accordion-body {
    display: block;
  }

  /* Uber Eats 餐點橫向卡片 */
  .med-card {
    padding: 14px 10px;
    margin: 2px -6px;
    border-radius: 12px;
    border-bottom: 1px solid var(--border);
    border-left: 4px solid transparent;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
  }

  .med-card:not(.sortable-mode):active {
    background-color: #F2F4F3;
  }

  .med-card.selected {
    background-color: #F2FBF6;
    border-left: 4px solid #06C167;
    box-shadow: 0 2px 8px rgba(6, 193, 103, 0.12);
  }

  .med-card:last-child {
    border-bottom: none;
  }

  .med-info {
    flex: 1;
    min-width: 0;
  }

  .med-brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag-note {
    background-color: var(--warning-light);
    color: var(--warning);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }

  .med-actual {
    font-size: 13px;
    color: var(--ue-green-dark);
    font-weight: 700;
    margin-bottom: 3px;
  }

  .med-generic {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .btn-edit-mini {
    background: var(--bg-main);
    border: none;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
  }

  /* 排序模式控制列與拖曳把手樣式 */
  .slot-sort-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 6px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 4px;
  }

  .slot-sort-hint {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .btn-sort-toggle {
    background: var(--bg-main);
    border: 1px solid #DCDCDC;
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }

  .btn-sort-toggle.active {
    background: var(--ue-black);
    color: #FFFFFF;
    border-color: var(--ue-black);
  }

  .med-card.sortable-mode {
    background-color: #FAFAFA;
    border-radius: 12px;
    padding: 12px 10px;
    margin: 6px 0;
    border: 1px dashed #CCCCCC;
    border-bottom: 1px dashed #CCCCCC;
    cursor: grab;
    touch-action: none;
  }

  .med-card.dragging {
    opacity: 0.45;
    background-color: var(--ue-green-light);
    border-color: var(--ue-green);
  }

  .drag-handle-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding-right: 4px;
    color: var(--text-secondary);
    user-select: none;
  }

  .drag-grip {
    font-size: 18px;
    font-weight: 800;
    color: var(--ue-black);
    line-height: 1;
    padding: 2px 4px;
  }

  .sort-arrow-btns {
    display: flex;
    gap: 4px;
  }

  .sort-arrow-btns button {
    background: #FFFFFF;
    border: 1px solid #D5D5D5;
    border-radius: 6px;
    width: 24px;
    height: 22px;
    font-size: 10px;
    font-weight: 800;
    color: var(--ue-black);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sort-arrow-btns button:active {
    background: var(--ue-black);
    color: #FFF;
  }

  /* 右側餐點圖 + 懸浮圓形按鈕 (Uber Eats 經典設計) */
  .med-visual-wrap {
    position: relative;
    width: 88px;
    height: 88px;
    flex-shrink: 0;
  }

  .med-img-box {
    width: 88px;
    height: 88px;
    border-radius: 12px;
    background-color: var(--bg-main);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .med-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 懸浮在圖片右下角的加入按鈕 */
  .ue-add-btn {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: var(--ue-black);
    border: 1px solid #E0E0E0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.16);
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .ue-add-btn.checked {
    background-color: var(--ue-green);
    color: #FFFFFF;
    border-color: var(--ue-green);
    font-size: 15px;
  }

  /* 懸浮計數器膠囊 */
  .ue-stepper {
    position: absolute;
    bottom: -6px;
    right: -6px;
    background-color: var(--ue-black);
    color: #FFF;
    border-radius: 20px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }

  .ue-stepper button {
    background: none;
    border: none;
    color: #FFF;
    font-size: 16px;
    font-weight: 700;
    width: 22px;
    height: 24px;
    cursor: pointer;
  }

  .ue-stepper span {
    font-size: 13px;
    font-weight: 800;
    min-width: 14px;
    text-align: center;
  }

  /* 底部懸浮購物車 Bar (Uber Eats 黑色結帳條) */
  .bottom-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 760px;
    background-color: var(--ue-black);
    color: #FFF;
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    z-index: 200;
  }

  .bar-btn {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.15s;
  }

  .bar-btn:active {
    opacity: 0.85;
  }

  .bar-btn-cart {
    background-color: var(--ue-green);
    color: #000000;
  }

  .bar-btn-staging {
    background-color: #2B2B2B;
    color: #FFFFFF;
  }

  .badge-pill {
    background-color: rgba(0, 0, 0, 0.15);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
  }

  .bar-btn-staging .badge-pill {
    background-color: var(--warning);
    color: #FFF;
  }

  /* 彈出視窗 Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(0,0,0,0.55);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-sheet {
    background-color: var(--bg-card);
    width: 100%;
    max-width: 760px;
    max-height: 90vh;
    border-radius: 20px 20px 0 0;
    padding: 0 20px 20px;
    overflow-y: auto;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
    background-color: var(--bg-card);
    padding: 20px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .modal-header h2 {
    font-size: 18px;
    font-weight: 800;
  }

  .btn-close {
    background: var(--bg-main);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 清單項目樣式 */
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .list-item-info {
    flex: 1;
  }

  .list-item-title {
    font-weight: 800;
    font-size: 15px;
  }

  .list-item-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  /* 清單與暫存區按櫃位分隔區塊樣式 */
  .modal-slot-section {
    margin-bottom: 16px;
    background-color: var(--bg-main);
    border-radius: 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
  }

  .modal-slot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    margin-bottom: 4px;
    border-bottom: 1.5px solid #E2E2E2;
  }

  .modal-slot-badge {
    background-color: var(--ue-black);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 8px;
    letter-spacing: 0.3px;
  }

  .modal-slot-badge.staging {
    background-color: var(--warning);
  }

  .modal-slot-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
  }

  .modal-slot-section .list-item:last-child {
    border-bottom: none;
    padding-bottom: 4px;
  }

  .btn-move-staging {
    background-color: var(--warning-light);
    color: var(--warning);
    border: 1px solid var(--warning);
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-done-staging {
    background-color: var(--ue-green-light);
    color: var(--ue-green-dark);
    border: 1px solid var(--ue-green);
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .item-action-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn-remove-item {
    background-color: #EAEAEA;
    color: var(--text-secondary);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-remove-item:active {
    background-color: #D5D5D5;
    color: var(--danger);
  }

  .cart-footer-actions {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cart-footer-row {
    display: flex;
    gap: 8px;
  }

  /* 表單樣式 */
  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-primary);
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #DCDCDC;
    font-size: 14px;
    background-color: var(--bg-main);
    outline: none;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--ue-black);
    background-color: #FFF;
  }

  .form-row {
    display: flex;
    gap: 10px;
  }

  .form-row .form-group {
    flex: 1;
  }

  .img-helper-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  /* 專屬小浮水印設計 */
  .watermark {
    text-align: center;
    padding: 26px 16px 14px;
    font-size: 12px;
    color: #757575;
    letter-spacing: 0.5px;
  }

  .watermark span {
    background-color: #FFFFFF;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 700;
    border: 1px solid #E5E5E5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* 自訂提示訊息 Toast & 確認框 */
  .toast-msg {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background-color: var(--ue-black);
    color: #FFF;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }

  .toast-msg.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .confirm-dialog {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .confirm-dialog.open {
    display: flex;
  }

  .confirm-box {
    background: var(--bg-card);
    padding: 22px;
    border-radius: 16px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .confirm-box p {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .confirm-btns {
    display: flex;
    gap: 10px;
  }

  .confirm-btns button {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 圖片放大檢視 */
  .img-zoom-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 400;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .img-zoom-overlay.open { display: flex; }
  .img-zoom-overlay img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 14px;
    background: #FFF;
  }
</style>
</head>

<!-- 頂部浮動通知 -->
<div class="toast-msg" id="toastMsg"></div>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-logo">Med<span>Eats</span></div>
      <div class="delivery-pill">⚡ 10-15 分鐘補完</div>
    </div>
    <div class="header-actions">
      <button class="btn-pill-gray" onclick="openBackupModal()">備份/分享</button>
      <button class="btn-pill-black" onclick="openEditModal()">＋ 新增藥品</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜尋原廠名、台廠名、學名..." oninput="handleSearchInput()">
      <button type="button" class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()" title="清除搜尋">✕</button>
    </div>
    <div class="search-nav-controls" id="searchNavControls">
      <span class="search-match-count" id="searchMatchCount">0/0</span>
      <button type="button" class="btn-search-next" onclick="jumpToNextMatch()">▼ 下一筆</button>
    </div>
  </div>
</header>

<!-- 店家資訊提示列 (隨頁面滑出) -->
<div class="store-meta-bar">
  <span><span class="store-rating">★ 5.0</span> (準時下班調劑台) · 點擊儲位展開清單</span>
  <button class="btn-edit-mini" onclick="toggleAllSlots()">全部展開/收合</button>
</div>

<!-- 吸頂分區導覽 -->
<div class="sticky-zone-bar">
  <div class="zone-tabs" id="zoneTabs">
    <button class="zone-tab active" data-zone="ALL" onclick="selectZone('ALL')">全部儲位</button>
    <button class="zone-tab" data-zone="TOP" onclick="selectZone('TOP')">上層 (D區)</button>
    <button class="zone-tab" data-zone="LEFT" onclick="selectZone('LEFT')">左抽屜 (d-1-1~5)</button>
    <button class="zone-tab" data-zone="RIGHT" onclick="selectZone('RIGHT')">右抽屜 (d-1-6~10)</button>
  </div>
</div>

<!-- 藥品列表區 (點擊展開式手風琴) -->
<div class="container" id="medListContainer"></div>

<!-- 專屬小浮水印 -->
<div class="watermark">
  <span>✨ by 段嘟米🐾</span>
</div>

<!-- 底部懸浮購物車與暫存區 -->
<div class="bottom-bar">
  <button class="bar-btn bar-btn-cart" onclick="openCartModal()">
    <span>查看待補清單</span>
    <span class="badge-pill" id="cartBadge">0</span>
  </button>
  <button class="bar-btn bar-btn-staging" onclick="openStagingModal()">
    <span>📦 後方暫存區</span>
    <span class="badge-pill" id="stagingBadge">0</span>
  </button>
</div>

<!-- 1. 待補藥清單 (購物車) Modal -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>🛒 你的補藥訂單（待去庫存區拿）</h2>
      <button class="btn-close" onclick="closeModal('cartModal')">✕</button>
    </div>
    <div id="cartListContainer"></div>
    <div class="cart-footer-actions">
      <button class="btn-pill-gray" style="width:100%; padding: 12px;" onclick="copyCartText()">📋 複製純文字清單</button>
      <div class="cart-footer-row">
        <button class="btn-pill-black" style="flex:1; padding: 13px;" onclick="confirmClearCart()">清空訂單</button>
        <button class="btn-pill-black" style="flex:1.35; padding: 13px; background: var(--warning); color: #FFF;" onclick="confirmMoveAllToStaging()">整批已拿取 ➔</button>
      </div>
    </div>
  </div>
</div>

<!-- 2. 後方暫存區 Modal -->
<div class="modal-overlay" id="stagingModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>📦 已拿取／待上架）</h2>
      <button class="btn-close" onclick="closeModal('stagingModal')">✕</button>
    </div>
    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
      這裡記錄已經從庫存區拿回來、但還沒空塞進調劑台抽屜的藥品。塞好後請按「已上架」。
    </p>
    <div id="stagingListContainer"></div>
  </div>
</div>

<!-- 3. 新增 / 編輯藥品 Modal (支援自訂新儲位欄位 + 搜圖) -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="editModalTitle">＋ 新增藥品資料</h2>
      <button class="btn-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <input type="hidden" id="editMedId">
    <div class="form-row">
      <div class="form-group">
        <label>所屬區域</label>
        <select id="editZone" onchange="updateEditSlotOptions()">
          <option value="TOP">上層 (D區)</option>
          <option value="LEFT">左抽屜</option>
          <option value="RIGHT">右抽屜</option>
        </select>
      </div>
      <div class="form-group">
        <label>儲位代碼</label>
        <div style="display: flex; gap: 6px;">
          <select id="editSlot" onchange="handleSlotSelectChange()" style="flex: 1;"></select>
          <button type="button" class="btn-pill-black" style="padding: 0 11px; border-radius: 10px; white-space: nowrap; font-size: 12px;" onclick="triggerCustomSlot()">＋ 新增儲位</button>
        </div>
      </div>
    </div>

    <!-- 手動新增自訂儲位欄位 (點選「＋ 新增儲位」或選單自訂時顯示) -->
    <div class="form-group" id="customSlotGroup" style="display: none; background: var(--ue-green-light); padding: 12px; border-radius: 10px; border: 1px solid var(--ue-green);">

      <input type="text" id="editCustomSlot" placeholder="請輸入新儲位代碼（如 D-2、D-3）..." style="background: #FFF;">
    </div>

    <div class="form-group">
      <label>系統顯示名 / 常用原廠商品名 *</label>
      <input type="text" id="editBrand" placeholder="例如：Twynsta 80/5mg">
    </div>
    <div class="form-group">
      <label>院內實際商品名 / 台廠名 / 中文別稱</label>
      <input type="text" id="editActual" placeholder="例如：Co-midis (樂壓妥) 或 莫鼻卡">
    </div>
    <div class="form-group">
      <label>學名與劑量</label>
      <input type="text" id="editGeneric" placeholder="例如：Telmisartan 80mg / Amlodipine 5mg">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>點選模式</label>
        <select id="editMode">
          <option value="check">單純打勾 (適合散裝/固定量)</option>
          <option value="count">計算盒數/束數 (＋/－)</option>
        </select>
      </div>
      <div class="form-group">
        <label>特殊備註標籤 (選填)</label>
        <input type="text" id="editNote" placeholder="例如：盒裝、勿拆封">
      </div>
    </div>

    <div class="form-group">

  // 依據原廠藥盒配色與劑型生成高質感擬真對照圖 (包含外盒 + 泡殼藥錠/膠囊)
  function generateBrandBoxSvg(brand, note, zone) {
    const key = Object.keys(BRAND_VISUALS).find(k => (brand || '').toLowerCase().includes(k));
    const defaultPalettes = {
      TOP: { box: '#FFFFFF', stripe: '#006699', text: '#004466', stripeText: '原廠調劑', form: 'tab', pill1: '#FFFFFF', pill2: '#E1F5FE' },
      LEFT: { box: '#FFFFFF', stripe: '#06A357', text: '#046C38', stripeText: '左抽屜藥品', form: 'tab', pill1: '#FFFFFF', pill2: '#E8F5E9' },
      RIGHT: { box: '#FFFFFF', stripe: '#5E35B1', text: '#311B92', stripeText: '右抽屜藥品', form: 'tab', pill1: '#FFFFFF', pill2: '#EDE7F6' }
    };
    const v = key ? BRAND_VISUALS[key] : (defaultPalettes[zone] || defaultPalettes.TOP);
    const title = (brand || 'MED').substring(0, 11);
    const isCap = v.form === 'cap' || v.form === 'softcap' || (brand + note).toLowerCase().includes('cap') || note.includes('膠囊');
    const isPowder = v.form === 'powder' || (brand + note).includes('粉');

    let blisterSvg = '';
    if (isPowder) {
      // 鋁箔粉包外觀
      blisterSvg = `
        <g transform="translate(52, 54) rotate(10)">
          <rect x="0" y="0" width="54" height="42" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1.5"/>
          <line x1="0" y1="9" x2="54" y2="9" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="3,2"/>
          <text x="27" y="28" font-family="sans-serif" font-size="8" font-weight="800" fill="#E65100" text-anchor="middle">顆粒粉包</text>
        </g>`;
    } else if (isCap) {
      // 泡殼膠囊排裝外觀
      blisterSvg = `
        <g transform="translate(46, 56) rotate(12)">
          <rect x="0" y="0" width="64" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
          <g transform="translate(8, 7)">
            <rect x="0" y="0" width="8" height="8" rx="4" fill="${v.pill1}" stroke="#90A4AE" stroke-width="0.6"/>
            <rect x="6" y="0" width="8" height="8" rx="4" fill="${v.pill2}" stroke="#90A4AE" stroke-width="0.6"/>
          </g>
          <g transform="translate(26, 7)">
            <rect x="0" y="0" width="8" height="8" rx="4" fill="${v.pill1}" stroke="#90A4AE" stroke-width="0.6"/>
            <rect x="6" y="0" width="8" height="8" rx="4" fill="${v.pill2}" stroke="#90A4AE" stroke-width="0.6"/>
          </g>
          <g transform="translate(44, 7)">
            <rect x="0" y="0" width="8" height="8" rx="4" fill="${v.pill1}" stroke="#90A4AE" stroke-width="0.6"/>
            <rect x="6" y="0" width="8" height="8" rx="4" fill="${v.pill2}" stroke="#90A4AE" stroke-width="0.6"/>
          </g>
          <g transform="translate(8, 21)">
            <rect x="0" y="0" width="8" height="8" rx="4" fill="${v.pill1}" stroke="#90A4AE" stroke-width="0.6"/>
            <rect x="6" y="0" width="8" height="8" rx="4" fill="${v.pill2}" stroke="#90A4AE" stroke-width="0.6"/>
          </g>
          <g transform="translate(26, 21)">
            <rect x="0" y="0" width="8" height="8" rx="4" fill="${v.pill1}" stroke="#90A4AE" stroke-width="0.6"/>
            <rect x="6" y="0" width="8" height="8" rx="4" fill="${v.pill2}" stroke="#90A4AE" stroke-width="0.6"/>
          </g>
        </g>`;
    } else {
      // 泡殼圓錠排裝外觀
      blisterSvg = `
        <g transform="translate(48, 55) rotate(12)">
          <rect x="0" y="0" width="60" height="40" rx="6" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
          <circle cx="13" cy="12" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
          <circle cx="30" cy="12" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
          <circle cx="47" cy="12" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
          <circle cx="13" cy="28" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
          <circle cx="30" cy="28" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
          <circle cx="47" cy="28" r="5.5" fill="${v.pill1}" stroke="#90A4AE" stroke-width="1"/>
        </g>`;
    }

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
      <rect width="120" height="120" fill="#F4F5F7"/>
      <!-- 原廠藥盒主體 -->
      <g transform="translate(10, 14) rotate(-5)">
        <rect x="0" y="0" width="80" height="46" rx="5" fill="${v.box}" stroke="#D0D7DE" stroke-width="1.2"/>
        <rect x="0" y="33" width="80" height="13" rx="2" fill="${v.stripe}"/>
        <text x="8" y="18" font-family="sans-serif" font-size="11.5" font-weight="900" fill="${v.text}">${title}</text>
        <text x="8" y="29" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#666666">Rx 原廠包裝</text>

      </g>
      ${blisterSvg}
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  // 狀態變數 (升級為 v6 載入最新修正資料庫)
  let meds = DEFAULT_MEDS;
  let customZones = { TOP: [], LEFT: [], RIGHT: [] };
  let cart = {};
  let staging = {};
  let expandedSlots = new Set(['D-1-2', 'd-1-1']);
  let sortingSlots = new Set(); // 記錄目前開啟「拖曳排序模式」的儲位

  try {
    const savedMeds = localStorage.getItem('medeats_meds_v6');
    if (savedMeds) meds = JSON.parse(savedMeds);
    const savedCustomZones = localStorage.getItem('medeats_zones_v6');
    if (savedCustomZones) customZones = JSON.parse(savedCustomZones);
    const savedCart = localStorage.getItem('medeats_cart_v6');
    if (savedCart) cart = JSON.parse(savedCart);
    const savedStaging = localStorage.getItem('medeats_staging_v6');
    if (savedStaging) staging = JSON.parse(savedStaging);
  } catch (e) {
    console.warn('LocalStorage 讀取受限，使用記憶體模式');
  }

  let currentZone = 'ALL';
  let searchMatchIds = [];
  let currentMatchIdx = -1;

  function saveState() {
    try {
      localStorage.setItem('medeats_meds_v6', JSON.stringify(meds));
      localStorage.setItem('medeats_zones_v6', JSON.stringify(customZones));
      localStorage.setItem('medeats_cart_v6', JSON.stringify(cart));
      localStorage.setItem('medeats_staging_v6', JSON.stringify(staging));
    } catch (e) {
      console.warn('LocalStorage 寫入受限');
    }
    updateBadges();
  }

  // 動態取得該區域所有儲位 (包含預設 + 使用者自訂的新儲位)
  function getSlotsForZone(zone) {
    const set = new Set([...(BASE_ZONES[zone] || []), ...(customZones[zone] || [])]);
    meds.forEach(m => {
      if (m.zone === zone && m.slot) set.add(m.slot);
    });
    return Array.from(set);
  }

  // 自訂 Toast 提示
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toastMsg');
    el.innerText = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('show');
    }, 2500);
  }

  // 自訂確認框
  function showConfirm(msg, onConfirm) {
    document.getElementById('confirmText').innerText = msg;
    const yesBtn = document.getElementById('confirmYesBtn');
    yesBtn.onclick = () => {
      closeConfirm();
      onConfirm();
    };
    document.getElementById('confirmDialog').classList.add('open');
  }

  function closeConfirm() {
    document.getElementById('confirmDialog').classList.remove('open');
  }

  function updateBadges() {
    const cartCount = Object.keys(cart).length;
    const stagingCount = Object.keys(staging).length;
    document.getElementById('cartBadge').innerText = cartCount;
    document.getElementById('stagingBadge').innerText = stagingCount;
  }

  function selectZone(zone) {
    currentZone = zone;
    document.querySelectorAll('.zone-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.zone === zone);
    });
    renderMedList();
  }

  function toggleSlotAccordion(slot) {
    if (expandedSlots.has(slot)) {
      expandedSlots.delete(slot);
    } else {
      expandedSlots.add(slot);
    }
    renderMedList();
  }

  function toggleAllSlots() {
    const allSlots = new Set(meds.map(m => m.slot));
    if (expandedSlots.size > 0) {
      expandedSlots.clear();
    } else {
      expandedSlots = allSlots;
    }
    renderMedList();
  }

  // 切換單一儲位的「拖曳排序模式」
  function toggleSlotSortMode(slot) {
    if (sortingSlots.has(slot)) {
      sortingSlots.delete(slot);
      showToast(`已儲存 ${slot} 藥品順序`);
    } else {
      sortingSlots.add(slot);
      expandedSlots.add(slot);
      showToast(`已開啟 ${slot} 拖曳排序模式`);
    }
    renderMedList();
  }

  // 在同一個儲位內重新排列藥品順序並儲存
  function reorderMedInSlot(slot, fromMedId, toMedId) {
    if (!fromMedId || !toMedId || fromMedId === toMedId) return;
    const slotIndices = [];
    const slotItems = [];
    meds.forEach((m, idx) => {
      if (m.slot === slot) {
        slotIndices.push(idx);
        slotItems.push(m);
      }
    });

    const fromPos = slotItems.findIndex(m => m.id === fromMedId);
    const toPos = slotItems.findIndex(m => m.id === toMedId);
    if (fromPos === -1 || toPos === -1) return;

    const [movedItem] = slotItems.splice(fromPos, 1);
    slotItems.splice(toPos, 0, movedItem);

    slotIndices.forEach((origIdx, i) => {
      meds[origIdx] = slotItems[i];
    });

    saveState();
    renderMedList();
  }

  // 點擊 ▲ / ▼ 微調順序 (手機單手操作超方便)
  function moveMedStep(slot, medId, direction) {
    const slotItems = meds.filter(m => m.slot === slot);
    const pos = slotItems.findIndex(m => m.id === medId);
    const targetPos = pos + direction;
    if (targetPos < 0 || targetPos >= slotItems.length) return;
    reorderMedInSlot(slot, medId, slotItems[targetPos].id);
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightText(text, keyword) {
    if (!text || !keyword) return text || '';
    const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
    return text.replace(regex, '<mark class="search-hl">$1</mark>');
  }

  function handleSearchInput() {
    const keyword = document.getElementById('searchInput').value.trim();
    document.getElementById('searchClearBtn').style.display = keyword ? 'flex' : 'none';
    currentMatchIdx = -1;
    renderMedList();
    if (searchMatchIds.length > 0) {
      jumpToNextMatch();
    }
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClearBtn').style.display = 'none';
    searchMatchIds = [];
    currentMatchIdx = -1;
    renderMedList();
  }

  function jumpToNextMatch() {
    if (searchMatchIds.length === 0) return;
    currentMatchIdx = (currentMatchIdx + 1) % searchMatchIds.length;
    const targetId = searchMatchIds[currentMatchIdx];
    const targetMed = meds.find(m => m.id === targetId);
    if (targetMed && !expandedSlots.has(targetMed.slot)) {
      expandedSlots.add(targetMed.slot);
      renderMedList();
    }
    updateSearchNavUI();

    const cardEl = document.querySelector(`.med-card[data-med-id="${targetId}"]`);
    if (cardEl) {
      document.querySelectorAll('.med-card.search-focus').forEach(el => el.classList.remove('search-focus'));
      cardEl.classList.add('search-focus');
      const rect = cardEl.getBoundingClientRect();
      const offsetTop = window.pageYOffset + rect.top - 205;
      window.scrollTo({ top: Math.max(0, offsetTop), behavior: 'smooth' });
    }
  }

  function updateSearchNavUI() {
    const navEl = document.getElementById('searchNavControls');
    const countEl = document.getElementById('searchMatchCount');
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) {
      navEl.style.display = 'none';
      return;
    }
    navEl.style.display = 'flex';
    if (searchMatchIds.length === 0) {
      countEl.innerText = '0/0';
    } else {
      const displayIdx = currentMatchIdx >= 0 ? currentMatchIdx + 1 : 1;
      countEl.innerText = `${displayIdx}/${searchMatchIds.length}`;
    }
  }

  function renderMedList() {
    const container = document.getElementById('medListContainer');
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    container.innerHTML = '';

    // 過濾區域 (搜尋關鍵字時不隱藏其他藥品，而是高亮與跳轉)
    const zoneFiltered = meds.filter(m => {
      if (currentZone !== 'ALL' && m.zone !== currentZone) return false;
      return true;
    });

    searchMatchIds = [];
    const matchedSlots = new Set();
    if (keyword) {
      zoneFiltered.forEach(m => {
        const text = `${m.brand} ${m.actual} ${m.generic} ${m.note} ${m.slot}`.toLowerCase();
        if (text.includes(keyword)) {
          searchMatchIds.push(m.id);
          matchedSlots.add(m.slot);
        }
      });
    }
    updateSearchNavUI();

    if (zoneFiltered.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 48px 0; color: var(--text-secondary); font-weight:600;">目前此分區尚無藥品，點右上角「＋ 新增藥品」即可建立喔！</div>`;
      return;
    }

    // 依儲位分組顯示
    const grouped = {};
    zoneFiltered.forEach(m => {
      if (!grouped[m.slot]) grouped[m.slot] = [];
      grouped[m.slot].push(m);
    });

    Object.keys(grouped).forEach(slot => {
      const items = grouped[slot];
      // 若該格位有搜尋符合的藥品，自動展開方便檢視
      const isOpen = matchedSlots.has(slot) || expandedSlots.has(slot);
      const selectedInSlot = items.filter(m => (cart[m.id] || 0) > 0).length;

      const groupEl = document.createElement('div');
      groupEl.className = 'accordion-group' + (isOpen ? ' open' : '');

      const headerEl = document.createElement('div');
      headerEl.className = 'accordion-header';
      headerEl.onclick = () => toggleSlotAccordion(slot);
      headerEl.innerHTML = `
        <div class="accordion-title-wrap">
          <span class="slot-badge-lg">${highlightText(slot, keyword)}</span>
          <span class="slot-count-text">共 ${items.length} 項</span>
          ${selectedInSlot > 0 ? `<span class="slot-selected-pill">已選 ${selectedInSlot}</span>` : ''}
        </div>
        <span class="accordion-arrow">▼</span>
      `;
      groupEl.appendChild(headerEl);

      const bodyEl = document.createElement('div');
      bodyEl.className = 'accordion-body';
      const isSorting = sortingSlots.has(slot) && keyword.length === 0;

      // 儲位內頂部控制列：提供「⇅ 調整順序」點擊鍵位
      if (keyword.length === 0 && items.length > 1) {
        const sortBar = document.createElement('div');
        sortBar.className = 'slot-sort-bar';
        sortBar.innerHTML = `
          <span class="slot-sort-hint">${isSorting ? '上下拖曳藥品卡片或按箭頭調整順序' : '依照抽屜實際擺放順序排列'}</span>
          <button type="button" class="btn-sort-toggle ${isSorting ? 'active' : ''}" onclick="toggleSlotSortMode('${slot}')">
            ${isSorting ? '✓ 完成排序' : '⇅ 調整順序'}
          </button>
        `;
        bodyEl.appendChild(sortBar);
      }

      let draggedMedId = null;

      items.forEach(m => {
        const inCartQty = cart[m.id] || 0;
        const displayImg = m.img || generateBrandBoxSvg(m.brand, m.note, m.zone);
        const isFocused = keyword && searchMatchIds[currentMatchIdx] === m.id;

        const card = document.createElement('div');
        card.className = 'med-card'
          + (isSorting ? ' sortable-mode' : '')
          + (!isSorting && inCartQty > 0 ? ' selected' : '')
          + (isFocused ? ' search-focus' : '');
        card.dataset.medId = m.id;

        if (!isSorting) {
          card.onclick = () => {
            if (m.mode === 'count') {
              if (inCartQty === 0) {
                updateCartQty(m.id, 1);
                showToast('已加入待補清單，可調整盒/束數');
              }
            } else {
              toggleCartCheck(m.id);
            }
          };
        }

        if (isSorting) {
          card.draggable = true;

          // 桌機滑鼠拖曳事件
          card.addEventListener('dragstart', (e) => {
            draggedMedId = m.id;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            draggedMedId = null;
          });
          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
          });
          card.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedMedId && draggedMedId !== m.id) {
              reorderMedInSlot(slot, draggedMedId, m.id);
            }
          });

          // 手機觸控手指直接拖曳事件
          card.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            draggedMedId = m.id;
            card.classList.add('dragging');
          }, { passive: true });

          card.addEventListener('touchmove', (e) => {
            if (!draggedMedId) return;
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = targetEl ? targetEl.closest('.med-card.sortable-mode') : null;
            if (targetCard && targetCard.dataset.medId && targetCard.dataset.medId !== draggedMedId) {
              const targetId = targetCard.dataset.medId;
              reorderMedInSlot(slot, draggedMedId, targetId);
            }
          }, { passive: true });

          card.addEventListener('touchend', () => {
            card.classList.remove('dragging');
            draggedMedId = null;
          });
        }

        const floatingControlHtml = m.mode === 'count'
          ? (inCartQty > 0
              ? `<div class="ue-stepper" onclick="event.stopPropagation()">
                   <button onclick="event.stopPropagation(); updateCartQty('${m.id}', -1)">－</button>
                   <span>${inCartQty}</span>
                   <button onclick="event.stopPropagation(); updateCartQty('${m.id}', 1)">＋</button>
                 </div>`
              : `<button class="ue-add-btn" onclick="event.stopPropagation(); updateCartQty('${m.id}', 1); showToast('已加入待補清單，可調整盒/束數')">＋</button>`)
          : `<button class="ue-add-btn ${inCartQty > 0 ? 'checked' : ''}" onclick="event.stopPropagation(); toggleCartCheck('${m.id}')">
               ${inCartQty > 0 ? '✓' : '＋'}
             </button>`;

        const dragHandleHtml = isSorting
          ? `<div class="drag-handle-box">
               <div class="drag-grip" title="按住拖曳">☰</div>
               <div class="sort-arrow-btns">
                 <button type="button" onclick="moveMedStep('${slot}', '${m.id}', -1)" title="往上移">▲</button>
                 <button type="button" onclick="moveMedStep('${slot}', '${m.id}', 1)" title="往下移">▼</button>
               </div>
             </div>`
          : '';

        card.innerHTML = `
          ${dragHandleHtml}
          <div class="med-info">
            <div class="med-brand">
              <span>${highlightText(m.brand, keyword)}</span>
              ${m.note ? `<span class="tag-note">${highlightText(m.note, keyword)}</span>` : ''}
            </div>
            ${m.actual ? `<div class="med-actual">院內/別稱：${highlightText(m.actual, keyword)}</div>` : ''}
            <div class="med-generic">${m.generic ? highlightText(m.generic, keyword) : '尚未填寫學名'}</div>
            ${!isSorting ? `<button class="btn-edit-mini" onclick="event.stopPropagation(); openEditModal('${m.id}')">編輯 / 換圖</button>` : ''}
          </div>
          <div class="med-visual-wrap">
            <div class="med-img-box" onclick="event.stopPropagation(); ${isSorting ? '' : `zoomImage('${displayImg}')`}">
              <img src="${displayImg}" alt="${m.brand}">
            </div>
            ${!isSorting ? floatingControlHtml : ''}
          </div>
        `;
        bodyEl.appendChild(card);
      });

      groupEl.appendChild(bodyEl);
      container.appendChild(groupEl);
    });
  }

  function updateCartQty(id, delta) {
    const current = cart[id] || 0;
    const next = current + delta;
    if (next <= 0) {
      delete cart[id];
    } else {
      cart[id] = next;
    }
    saveState();
    renderMedList();
  }

  function toggleCartCheck(id) {
    if (cart[id]) {
      delete cart[id];
    } else {
      cart[id] = 1;
      showToast('已加入補藥訂單');
    }
    saveState();
    renderMedList();
  }

  // 依照原調劑台順序 (meds 陣列中的實際順序，包含櫃位與櫃內拖曳順序) 取得已選品項並按櫃位分組
  function getOrderedGroupedItems(sourceMap) {
    const groups = [];
    const groupMap = {};
    meds.forEach(m => {
      if (sourceMap[m.id]) {
        if (!groupMap[m.slot]) {
          groupMap[m.slot] = { slot: m.slot, items: [] };
          groups.push(groupMap[m.slot]);
        }
        groupMap[m.slot].items.push({ med: m, qty: sourceMap[m.id] });
      }
    });
    return groups;
  }

  // 開啟購物車清單 (按櫃位分隔，直接展開不收合，依原調劑台順序排列)
  function openCartModal() {
    const container = document.getElementById('cartListContainer');
    container.innerHTML = '';
    const groups = getOrderedGroupedItems(cart);

    if (groups.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 30px 0; color: var(--text-secondary); font-weight:600;">目前沒有待補的藥品，快去選購吧！</div>`;
    } else {
      groups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'modal-slot-section';
        section.innerHTML = `
          <div class="modal-slot-header">
            <span class="modal-slot-badge">${group.slot}</span>
            <span class="modal-slot-count">共 ${group.items.length} 項</span>
          </div>
        `;

        group.items.forEach(({ med: m, qty }) => {
          const qtyText = m.mode === 'count' ? ` × ${qty} 盒/束` : ' (需補)';
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="list-item-info">
              <div class="list-item-title">${m.brand} <span style="color:var(--ue-green-dark);">${qtyText}</span></div>
              <div class="list-item-sub">${m.actual ? m.actual + ' | ' : ''}${m.generic}</div>
            </div>
            <div class="item-action-group">
              <button class="btn-done-staging" onclick="directShelveFromCart('${m.id}')">✓ 直接上架</button>
              <button class="btn-move-staging" onclick="moveToStaging('${m.id}')">放後方 ➔</button>
              <button class="btn-remove-item" onclick="removeFromCart('${m.id}')" title="移除此項">✕</button>
            </div>
          `;
          section.appendChild(item);
        });

        container.appendChild(section);
      });
    }
    document.getElementById('cartModal').classList.add('open');
  }

  // 直接從待補清單上架歸位 (不進入後方暫存區)
  function directShelveFromCart(id) {
    delete cart[id];
    saveState();
    renderMedList();
    openCartModal();
    showToast('已直接上架歸位！');
  }

  // 從待補清單移除單筆項目
  function removeFromCart(id) {
    delete cart[id];
    saveState();
    renderMedList();
    openCartModal();
    showToast('已從待補清單移除');
  }

  // 整批已拿取（全部移至後方暫存區）
  function confirmMoveAllToStaging() {
    const ids = Object.keys(cart);
    if (ids.length === 0) return showToast('目前沒有待補的藥品喔！');
    showConfirm(`確定將全部 ${ids.length} 項藥品移至後方暫存區嗎？`, () => {
      ids.forEach(id => {
        staging[id] = (staging[id] || 0) + cart[id];
        delete cart[id];
      });
      saveState();
      renderMedList();
      closeModal('cartModal');
      showToast(`已將 ${ids.length} 項全部移至後方暫存區`);
    });
  }

  // 移至後方暫存區
  function moveToStaging(id) {
    staging[id] = (staging[id] || 0) + cart[id];
    delete cart[id];
    saveState();
    renderMedList();
    openCartModal();
    showToast('已移至後方暫存區');
  }

  // 開啟後方暫存區 (按櫃位分隔，直接展開不收合，依原調劑台順序排列)
  function openStagingModal() {
    const container = document.getElementById('stagingListContainer');
    container.innerHTML = '';
    const groups = getOrderedGroupedItems(staging);

    if (groups.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 30px 0; color: var(--text-secondary); font-weight:600;">太棒了！後方沒有堆積未補上的藥品。</div>`;
    } else {
      groups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'modal-slot-section';
        section.innerHTML = `
          <div class="modal-slot-header">
            <span class="modal-slot-badge staging">歸位 ➔ ${group.slot}</span>
            <span class="modal-slot-count">共 ${group.items.length} 項</span>
          </div>
        `;

        group.items.forEach(({ med: m, qty }) => {
          const qtyText = m.mode === 'count' ? ` × ${qty} 盒/束` : '';
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="list-item-info">
              <div class="list-item-title">${m.brand}<span style="color:var(--warning);">${qtyText}</span></div>
              <div class="list-item-sub">${m.actual ? m.actual + ' | ' : ''}${m.generic}</div>
            </div>
            <button class="btn-done-staging" onclick="completeStaging('${m.id}')">✓ 已上架完成</button>
          `;
          section.appendChild(item);
        });

        container.appendChild(section);
      });
    }
    document.getElementById('stagingModal').classList.add('open');
  }

  function completeStaging(id) {
    delete staging[id];
    saveState();
    openStagingModal();
    showToast('已歸位完成！');
  }

  // 剪貼簿複製方法
  function fallbackCopyText(text, successMsg) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showToast(successMsg);
    } catch (err) {
      showToast('複製失敗，請手動選取複製');
    }
    document.body.removeChild(textArea);
  }

  function copyCartText() {
    const groups = getOrderedGroupedItems(cart);
    if (groups.length === 0) return showToast('清單是空的喔！');
    
    let text = '【MedEats 調劑台補藥清單】\n';
    groups.forEach(group => {
      text += `\n【${group.slot}】\n`;
      group.items.forEach(({ med: m, qty: q }) => {
        const qty = m.mode === 'count' ? ` (${q}盒/束)` : '';
        const actual = m.actual ? ` [${m.actual}]` : '';
        text += `□ ${m.brand}${actual}${qty}\n`;
      });
    });
    text += '\n— by 段嘟米';

    fallbackCopyText(text, '已複製補藥清單！可直接貼到 Line 備忘錄');
  }

  function confirmClearCart() {
    if (Object.keys(cart).length === 0) return;
    showConfirm('確定要清空目前的待補藥清單嗎？', () => {
      cart = {};
      saveState();
      renderMedList();
      closeModal('cartModal');
      showToast('購物車已清空');
    });
  }

  // 更新儲位下拉選單 (包含「➕ 自訂新儲位」選項)
  function updateEditSlotOptions(selectedSlot = '') {
    const zone = document.getElementById('editZone').value;
    const slotSelect = document.getElementById('editSlot');
    const slots = getSlotsForZone(zone);
    slotSelect.innerHTML = '';

    slots.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.innerText = s;
      if (s === selectedSlot) opt.selected = true;
      slotSelect.appendChild(opt);
    });

    const customOpt = document.createElement('option');
    customOpt.value = '__CUSTOM__';
    customOpt.innerText = '➕ 自訂新儲位代碼...';
    slotSelect.appendChild(customOpt);

    handleSlotSelectChange();
  }

  function handleSlotSelectChange() {
    const val = document.getElementById('editSlot').value;
    const customGroup = document.getElementById('customSlotGroup');
    if (val === '__CUSTOM__') {
      customGroup.style.display = 'block';
      document.getElementById('editCustomSlot').focus();
    } else {
      customGroup.style.display = 'none';
    }
  }

  // 點擊「＋ 新增儲位」快捷按鈕直接展開輸入框
  function triggerCustomSlot() {
    const slotSelect = document.getElementById('editSlot');
    slotSelect.value = '__CUSTOM__';
    handleSlotSelectChange();
  }

  function openEditModal(id = null) {
    const title = document.getElementById('editModalTitle');
    const btnDel = document.getElementById('btnDeleteMed');
    document.getElementById('editImageFile').value = '';
    document.getElementById('editCustomSlot').value = '';

    if (id) {
      const m = meds.find(item => item.id === id);
      title.innerText = '編輯藥品資料';
      document.getElementById('editMedId').value = m.id;
      document.getElementById('editZone').value = m.zone;
      updateEditSlotOptions(m.slot);
      document.getElementById('editBrand').value = m.brand;
      document.getElementById('editActual').value = m.actual || '';
      document.getElementById('editGeneric').value = m.generic || '';
      document.getElementById('editMode').value = m.mode || 'check';
      document.getElementById('editNote').value = m.note || '';
      document.getElementById('editImageBase64').value = m.img || '';
      document.getElementById('editImageUrl').value = (m.img && m.img.startsWith('http')) ? m.img : '';
      const previewSrc = m.img || generateBrandBoxSvg(m.brand, m.note, m.zone);
      document.getElementById('imagePreview').innerHTML = `<img src="${previewSrc}" style="width:100%; border-radius:10px; border:1px solid #DDD;">`;
      btnDel.style.display = 'block';
    } else {
      title.innerText = '＋ 新增藥品資料';
      document.getElementById('editMedId').value = '';
      document.getElementById('editZone').value = currentZone !== 'ALL' ? currentZone : 'TOP';
      updateEditSlotOptions();
      document.getElementById('editBrand').value = '';
      document.getElementById('editActual').value = '';
      document.getElementById('editGeneric').value = '';
      document.getElementById('editMode').value = 'check';
      document.getElementById('editNote').value = '';
      document.getElementById('editImageBase64').value = '';
      document.getElementById('editImageUrl').value = '';
      document.getElementById('imagePreview').innerHTML = '';
      btnDel.style.display = 'none';
    }
    document.getElementById('editModal').classList.add('open');
  }

  function handleImageUrlInput() {
    const url = document.getElementById('editImageUrl').value.trim();
    if (url.startsWith('http')) {
      document.getElementById('editImageBase64').value = url;
      document.getElementById('imagePreview').innerHTML = `<img src="${url}" style="width:100%; border-radius:10px; border:1px solid #DDD;" onerror="this.style.display='none'">`;
    }
  }

  function resetAutoSvg() {
    document.getElementById('editImageBase64').value = '';
    document.getElementById('editImageUrl').value = '';
    const brand = document.getElementById('editBrand').value.trim() || 'MED';
    const note = document.getElementById('editNote').value.trim();
    const zone = document.getElementById('editZone').value;
    const svg = generateBrandBoxSvg(brand, note, zone);
    document.getElementById('imagePreview').innerHTML = `<img src="${svg}" style="width:100%; border-radius:10px; border:1px solid #DDD;">`;
    showToast('已恢復為原廠擬真藥盒圖');
  }

  // 壓縮並轉存圖片為 Base64
  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 300;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('editImageBase64').value = compressedBase64;
        document.getElementById('editImageUrl').value = '';
        document.getElementById('imagePreview').innerHTML = `<img src="${compressedBase64}" style="width:100%; border-radius:10px; border:1px solid #DDD;">`;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function saveMed() {
    const id = document.getElementById('editMedId').value;
    const brand = document.getElementById('editBrand').value.trim();
    if (!brand) return showToast('請至少填寫藥品名稱喔！');

    const zone = document.getElementById('editZone').value;
    let finalSlot = document.getElementById('editSlot').value;
    if (finalSlot === '__CUSTOM__') {
      finalSlot = document.getElementById('editCustomSlot').value.trim();
      if (!finalSlot) return showToast('請輸入自訂的新儲位代碼（如 D-2、D-3）！');
      if (!customZones[zone]) customZones[zone] = [];
      if (!customZones[zone].includes(finalSlot)) {
        customZones[zone].push(finalSlot);
      }
    }

    const medData = {
      id: id || 'm_' + Date.now(),
      zone: zone,
      slot: finalSlot,
      brand: brand,
      actual: document.getElementById('editActual').value.trim(),
      generic: document.getElementById('editGeneric').value.trim(),
      mode: document.getElementById('editMode').value,
      note: document.getElementById('editNote').value.trim(),
      img: document.getElementById('editImageBase64').value
    };

    if (id) {
      const idx = meds.findIndex(m => m.id === id);
      if (idx !== -1) meds[idx] = medData;
      showToast('藥品資料已更新');
    } else {
      meds.push(medData);
      showToast(`已新增至儲位 ${finalSlot}`);
    }

    expandedSlots.add(finalSlot); // 自動展開該儲位方便確認
    saveState();
    renderMedList();
    closeModal('editModal');
  }

  function confirmDeleteMed() {
    const id = document.getElementById('editMedId').value;
    showConfirm('確定要刪除這筆藥品資料嗎？', () => {
      meds = meds.filter(m => m.id !== id);
      delete cart[id];
      delete staging[id];
      saveState();
      renderMedList();
      closeModal('editModal');
      showToast('已刪除藥品');
    });
  }

  // 備份與匯入
  function openBackupModal() {
    document.getElementById('backupModal').classList.add('open');
  }

  function exportData() {
    const dataStr = JSON.stringify(meds);
    fallbackCopyText(dataStr, '已複製全部藥品資料庫代碼！可傳給同事匯入');
  }

  function importData() {
    const raw = document.getElementById('importInput').value.trim();
    if (!raw) return showToast('請先貼上資料代碼！');
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        meds = parsed;
        saveState();
        renderMedList();
        closeModal('backupModal');
        showToast('資料匯入成功！');
      } else {
        showToast('格式不正確喔！');
      }
    } catch (e) {
      showToast('代碼解析失敗，請確認有完整複製');
    }
  }

  function zoomImage(src) {
    document.getElementById('zoomedImg').src = src;
    document.getElementById('imgZoomOverlay').classList.add('open');
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('open');
  }

  // 初始化
  window.onload = function() {
    updateBadges();
    renderMedList();
  };
</script>
</body>
